name: Android APK

# Builds a release APK on every push/PR (downloadable as a workflow artifact).
# A manual run ("Run workflow") or a v* tag also publishes a GitHub pre-release
# with the .apk attached, for direct download on a phone.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed only to publish the pre-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Optional release signing. Without these secrets the APK is signed with
      # the runner's debug key (installable, but each build may need a reinstall).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WATTSON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wattson-release.jks"
            echo "WATTSON_KEYSTORE_FILE=$RUNNER_TEMP/wattson-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "::warning::WATTSON_KEYSTORE_BASE64 is not set; the release APK will be debug-signed."
          fi

      - name: Test, lint and build release APK
        env:
          WATTSON_KEYSTORE_PASSWORD: ${{ secrets.WATTSON_KEYSTORE_PASSWORD }}
          WATTSON_KEY_ALIAS: ${{ secrets.WATTSON_KEY_ALIAS }}
          WATTSON_KEY_PASSWORD: ${{ secrets.WATTSON_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Rename APK
        run: |
          APK="wattson-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: wattson-apk-${{ github.run_number }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('test-build-{0}', github.run_number) }}
          name: Wattson test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ env.APK }}
          body: |
            Test APK built from ${{ github.sha }}.
            Install: download the .apk on your Android phone (Android 8.0+) and allow "Install unknown apps" for your browser when prompted.
