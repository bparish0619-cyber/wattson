name: Android APK

# Builds the Android app in android/: unit tests, lint and a release APK, kept as a
# workflow artifact. A manual run ("Run workflow") also publishes a GitHub Release
# (tag android-v1.0.N) with the .apk attached, for direct download on a phone.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed only to publish the release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Optional release signing. Without these secrets the APK is signed with
      # the runner's debug key (installable, but each build may need a reinstall).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WATTSON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wattson-release.jks"
            echo "WATTSON_KEYSTORE_FILE=$RUNNER_TEMP/wattson-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the Wattson release key; installs over earlier releases." >> "$GITHUB_ENV"
          else
            echo "SIGNING_NOTE=Signed with a temporary debug key; uninstall any earlier Wattson build before installing." >> "$GITHUB_ENV"
            echo "::warning::WATTSON_KEYSTORE_BASE64 is not set; the release APK will be debug-signed."
          fi

      - name: Test, lint and build release APK
        env:
          WATTSON_KEYSTORE_PASSWORD: ${{ secrets.WATTSON_KEYSTORE_PASSWORD }}
          WATTSON_KEY_ALIAS: ${{ secrets.WATTSON_KEY_ALIAS }}
          WATTSON_KEY_PASSWORD: ${{ secrets.WATTSON_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Rename APK
        run: |
          APK="wattson-android-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: wattson-android-${{ github.run_number }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Wattson for Android 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ env.APK }}
          body: |
            Native Android build of Wattson: the poller, analysis and dashboard running on the phone.

            ## Install
            1. Download **${{ env.APK }}** below on an Android 8.0+ phone.
            2. Open it and allow **Install unknown apps** when prompted.
            3. Choose **Explore with Demo Vehicle**, or link your Rivian account.

            ## Build details
            - Version: `1.0.${{ github.run_number }}`
            - Commit: ${{ github.sha }}
            - Signing: ${{ env.SIGNING_NOTE }}
            - Checks: unit tests and Android lint passed before this APK was built.
